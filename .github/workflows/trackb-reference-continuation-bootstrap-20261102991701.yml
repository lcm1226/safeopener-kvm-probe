name: trackb-reference-continuation-bootstrap-20261102991701

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trackb-reference-continuation-bootstrap-20261102991701.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: trackb-reference-continuation-bootstrap-20261102991701
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CAMPAIGN_ID: "20261102991701"
      BASE_CAMPAIGN_ID: "20261102587109"
      BASE_SOURCE_RUN_ID: "41331134357"
      PROOF_HEAD: ed865d3bb49bac3157ca4eb0523c69ae83753d5f
      ATTESTATION_SHA256: b5d41c8c86586c80114abef7a50d1a30946a4e49bccd63e03c56b4b1b7c10766
    steps:
      - name: Orchestrate one corrective blast-only continuation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          [[ "$CAMPAIGN_ID" =~ ^[0-9]+$ ]]
          [[ "$BASE_CAMPAIGN_ID" =~ ^[0-9]+$ ]]
          [[ "$BASE_SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CAMPAIGN_ID" != "$BASE_CAMPAIGN_ID" ]]
          [[ "$PROOF_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ATTESTATION_SHA256" =~ ^[0-9a-f]{64}$ ]]

          api="https://api.github.com/repos/$REPO"
          h=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')
          main_sha="$(curl -fsSL "${h[@]}" "$api/git/ref/heads/main" | jq -r '.object.sha')"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || { echo "MAIN_LEASE_MOVED event=$GITHUB_SHA live=$main_sha"; exit 101; }

          state_json() {
            local kind="$1" out code
            out="$(mktemp)"
            code="$(curl -sSL -o "$out" -w '%{http_code}' "${h[@]}" "$api/contents/runtime/${kind}-${CAMPAIGN_ID}.json?ref=runtime-state")"
            if [[ "$code" == 200 ]]; then
              jq -r '.content' "$out" | tr -d '\n' | base64 -d
              rm -f "$out"
              return 0
            fi
            rm -f "$out"
            return 1
          }
          put_state() {
            local kind="$1" payload="$2" encoded body code
            encoded="$(printf '%s' "$payload" | base64 -w0)"
            body="$(jq -nc --arg message "runtime: $kind $CAMPAIGN_ID" --arg content "$encoded" --arg branch runtime-state '{message:$message,content:$content,branch:$branch}')"
            code="$(curl -sS -o "$RUNNER_TEMP/state-put.out" -w '%{http_code}' -X PUT "${h[@]}" "$api/contents/runtime/${kind}-${CAMPAIGN_ID}.json" -d "$body")"
            [[ "$code" == 201 ]] || { cat "$RUNNER_TEMP/state-put.out"; exit 102; }
          }
          workflow_dispatch_ids() {
            local wf="$1"
            curl -fsSL "${h[@]}" "$api/actions/workflows/$wf/runs?event=workflow_dispatch&branch=main&per_page=50" | jq -r '.workflow_runs[].id'
          }
          find_new_run() {
            local wf="$1" before="$2" id
            for _ in $(seq 1 90); do
              while read -r id; do
                [[ -n "$id" ]] || continue
                if ! grep -Fxq "$id" "$before"; then
                  echo "$id"
                  return 0
                fi
              done < <(workflow_dispatch_ids "$wf")
              sleep 1
            done
            return 1
          }
          run_json() {
            curl -fsSL "${h[@]}" "$api/actions/runs/$1"
          }
          wait_workflow_available() {
            local wf="$1" out code
            out="$(mktemp)"
            for _ in $(seq 1 60); do
              code="$(curl -sS -o "$out" -w '%{http_code}' "${h[@]}" "$api/actions/workflows/$wf")"
              if [[ "$code" == 200 ]] && [[ "$(jq -r '.state' "$out")" == active ]]; then
                rm -f "$out"
                return 0
              fi
              sleep 1
            done
            cat "$out" || true
            rm -f "$out"
            return 1
          }

          wait_workflow_available trackb-reference-continuation-source.yml || { echo CONTINUATION_SOURCE_WORKFLOW_UNAVAILABLE; exit 119; }
          wait_workflow_available trackb-reference-continuation-controller.yml || { echo CONTINUATION_CONTROLLER_WORKFLOW_UNAVAILABLE; exit 120; }
          echo "CONTINUATION_WORKFLOWS_AVAILABLE=PASS"

          for kind in \
            trackb-ref-continuation-bootstrap-dispatch \
            trackb-ref-observer-ready \
            trackb-ref-observer-established \
            trackb-ref-observer-cut \
            trackb-ref-continuation-base \
            trackb-ref-continuation-armed \
            trackb-ref-continuation-controller-result \
            trackb-ref-combined-observation; do
            if state_json "$kind" >/dev/null 2>&1; then
              echo "CAMPAIGN_STATE_COLLISION kind=$kind"
              exit 103
            fi
          done
          echo "CAMPAIGN_STATE_COLLISION=NONE"

          before_observer="$(mktemp)"
          workflow_dispatch_ids trackb-reference-observer.yml > "$before_observer"
          observer_body="$(jq -nc --arg ref main --arg c "$CAMPAIGN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" '{ref:$ref,inputs:{campaign_id:$c,proof_head:$h,attestation_sha256:$a}}')"
          code="$(curl -sS -o "$RUNNER_TEMP/observer-dispatch.out" -w '%{http_code}' -X POST "${h[@]}" "$api/actions/workflows/trackb-reference-observer.yml/dispatches" -d "$observer_body")"
          [[ "$code" == 204 ]] || { cat "$RUNNER_TEMP/observer-dispatch.out"; echo "OBSERVER_DISPATCH_HTTP=$code"; exit 104; }
          observer_run_id="$(find_new_run trackb-reference-observer.yml "$before_observer")" || { echo OBSERVER_RUN_NOT_FOUND; exit 105; }
          observer_j="$(run_json "$observer_run_id")"
          [[ "$(jq -r '.event' <<<"$observer_j")" == workflow_dispatch ]]
          [[ "$(jq -r '.head_sha' <<<"$observer_j")" == "$main_sha" ]]
          [[ "$(jq -r '.name' <<<"$observer_j")" == trackb-reference-observer ]]
          echo "OBSERVER_RUN_ID=$observer_run_id"

          observer_ready=''
          for _ in $(seq 1 300); do
            observer_ready="$(state_json trackb-ref-observer-ready 2>/dev/null || true)"
            [[ -n "$observer_ready" ]] && break
            observer_j="$(run_json "$observer_run_id")"
            [[ "$(jq -r '.status' <<<"$observer_j")" != completed ]] || { echo "OBSERVER_EARLY_CONCLUSION=$(jq -r '.conclusion' <<<"$observer_j")"; exit 106; }
            sleep 1
          done
          [[ -n "$observer_ready" ]] || { echo OBSERVER_READY_TIMEOUT; exit 107; }
          jq -e --arg c "$CAMPAIGN_ID" --arg r "$observer_run_id" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" \
            '.schemaVersion==1 and .campaignId==$c and .observerRunId==$r and .proofHead==$h and .attestationSha256==$a and .preflightPassed==true and .host=="bore.pub" and (.port|type)=="number"' \
            <<<"$observer_ready" >/dev/null
          observer_host="$(jq -r '.host' <<<"$observer_ready")"
          observer_port="$(jq -r '.port' <<<"$observer_ready")"
          echo "OBSERVER_READY=PASS host=$observer_host port=$observer_port"

          [[ "$(curl -fsSL "${h[@]}" "$api/git/ref/heads/main" | jq -r '.object.sha')" == "$main_sha" ]] || { echo MAIN_MOVED_BEFORE_SOURCE; exit 108; }
          before_source="$(mktemp)"
          workflow_dispatch_ids trackb-reference-continuation-source.yml > "$before_source"
          source_body="$(jq -nc --arg ref main --arg c "$CAMPAIGN_ID" --arg bc "$BASE_CAMPAIGN_ID" --arg br "$BASE_SOURCE_RUN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" --arg oh "$observer_host" --arg op "$observer_port" '{ref:$ref,inputs:{campaign_id:$c,base_campaign_id:$bc,base_source_run_id:$br,proof_head:$h,attestation_sha256:$a,observer_host:$oh,observer_port:$op}}')"
          code="$(curl -sS -o "$RUNNER_TEMP/source-dispatch.out" -w '%{http_code}' -X POST "${h[@]}" "$api/actions/workflows/trackb-reference-continuation-source.yml/dispatches" -d "$source_body")"
          [[ "$code" == 204 ]] || { cat "$RUNNER_TEMP/source-dispatch.out"; echo "SOURCE_DISPATCH_HTTP=$code"; exit 109; }
          source_run_id="$(find_new_run trackb-reference-continuation-source.yml "$before_source")" || { echo SOURCE_RUN_NOT_FOUND; exit 110; }
          source_j="$(run_json "$source_run_id")"
          [[ "$(jq -r '.event' <<<"$source_j")" == workflow_dispatch ]]
          [[ "$(jq -r '.head_sha' <<<"$source_j")" == "$main_sha" ]]
          [[ "$(jq -r '.name' <<<"$source_j")" == trackb-reference-continuation-source ]]
          echo "SOURCE_RUN_ID=$source_run_id"

          dispatch_state="$(jq -nc --arg c "$CAMPAIGN_ID" --arg b "$GITHUB_RUN_ID" --arg bc "$BASE_CAMPAIGN_ID" --arg br "$BASE_SOURCE_RUN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" --arg p "$main_sha" --arg o "$observer_run_id" --arg s "$source_run_id" --arg host "$observer_host" --argjson port "$observer_port" \
            '{schemaVersion:1,campaignId:$c,bootstrapRunId:$b,baseCampaignId:$bc,baseSourceRunId:$br,proofHead:$h,attestationSha256:$a,probeRepoHead:$p,observerRunId:$o,sourceRunId:$s,observerHost:$host,observerPort:$port}')"
          put_state trackb-ref-continuation-bootstrap-dispatch "$dispatch_state"
          echo "CONTINUATION_BOOTSTRAP_DISPATCH_STATE=PASS"

          observer_established=''
          continuation_base=''
          continuation_armed=''
          for _ in $(seq 1 1200); do
            [[ -n "$observer_established" ]] || observer_established="$(state_json trackb-ref-observer-established 2>/dev/null || true)"
            [[ -n "$continuation_base" ]] || continuation_base="$(state_json trackb-ref-continuation-base 2>/dev/null || true)"
            [[ -n "$continuation_armed" ]] || continuation_armed="$(state_json trackb-ref-continuation-armed 2>/dev/null || true)"
            if [[ -n "$observer_established" && -n "$continuation_base" && -n "$continuation_armed" ]]; then break; fi
            source_j="$(run_json "$source_run_id")"
            if [[ "$(jq -r '.status' <<<"$source_j")" == completed ]]; then
              echo "SOURCE_PREARM_CONCLUSION=$(jq -r '.conclusion' <<<"$source_j")"
              exit 111
            fi
            sleep 1
          done
          [[ -n "$observer_established" && -n "$continuation_base" && -n "$continuation_armed" ]] || { echo PRE_CONTROLLER_STATE_TIMEOUT; exit 112; }
          jq -e --arg c "$CAMPAIGN_ID" --arg r "$observer_run_id" --arg h "$PROOF_HEAD" '.campaignId==$c and .observerRunId==$r and .proofHead==$h and (.pulseCount|type)=="number" and .pulseCount>=2 and .cutObservedAtMs==null' <<<"$observer_established" >/dev/null
          jq -e --arg c "$CAMPAIGN_ID" --arg r "$source_run_id" --arg bc "$BASE_CAMPAIGN_ID" --arg br "$BASE_SOURCE_RUN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" '.campaignId==$c and .continuationSourceRunId==$r and .baseCampaignId==$bc and .baseSourceRunId==$br and .proofHead==$h and .attestationSha256==$a and .observation.commitSha==$h' <<<"$continuation_base" >/dev/null
          jq -e --arg c "$CAMPAIGN_ID" --arg r "$source_run_id" --arg bc "$BASE_CAMPAIGN_ID" --arg br "$BASE_SOURCE_RUN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" '.campaignId==$c and .continuationSourceRunId==$r and .baseCampaignId==$bc and .baseSourceRunId==$br and .proofHead==$h and .attestationSha256==$a and .pulseEstablished==true and .perSessionCutConfirmed==true and .siblingSurvivedSessionCut==true' <<<"$continuation_armed" >/dev/null
          [[ "$(jq -r '.observerPort' <<<"$continuation_armed")" == "$observer_port" ]]
          echo "PRE_CONTROLLER_CONTINUATION_BINDING=PASS"

          [[ "$(curl -fsSL "${h[@]}" "$api/git/ref/heads/main" | jq -r '.object.sha')" == "$main_sha" ]] || { echo MAIN_MOVED_BEFORE_CONTROLLER; exit 113; }
          before_controller="$(mktemp)"
          workflow_dispatch_ids trackb-reference-continuation-controller.yml > "$before_controller"
          controller_body="$(jq -nc --arg ref main --arg c "$CAMPAIGN_ID" --arg bc "$BASE_CAMPAIGN_ID" --arg br "$BASE_SOURCE_RUN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" --arg p "$main_sha" --arg o "$observer_run_id" --arg s "$source_run_id" '{ref:$ref,inputs:{campaign_id:$c,base_campaign_id:$bc,base_source_run_id:$br,proof_head:$h,attestation_sha256:$a,probe_repo_head:$p,observer_run_id:$o,source_run_id:$s}}')"
          code="$(curl -sS -o "$RUNNER_TEMP/controller-dispatch.out" -w '%{http_code}' -X POST "${h[@]}" "$api/actions/workflows/trackb-reference-continuation-controller.yml/dispatches" -d "$controller_body")"
          [[ "$code" == 204 ]] || { cat "$RUNNER_TEMP/controller-dispatch.out"; echo "CONTROLLER_DISPATCH_HTTP=$code"; exit 114; }
          controller_run_id="$(find_new_run trackb-reference-continuation-controller.yml "$before_controller")" || { echo CONTROLLER_RUN_NOT_FOUND; exit 115; }
          controller_j="$(run_json "$controller_run_id")"
          [[ "$(jq -r '.event' <<<"$controller_j")" == workflow_dispatch ]]
          [[ "$(jq -r '.head_sha' <<<"$controller_j")" == "$main_sha" ]]
          [[ "$(jq -r '.name' <<<"$controller_j")" == trackb-reference-continuation-controller ]]
          echo "CONTROLLER_RUN_ID=$controller_run_id"

          result=''
          for _ in $(seq 1 1200); do
            controller_j="$(run_json "$controller_run_id")"
            if [[ "$(jq -r '.status' <<<"$controller_j")" == completed ]]; then
              [[ "$(jq -r '.conclusion' <<<"$controller_j")" == success ]] || { echo "CONTROLLER_CONCLUSION=$(jq -r '.conclusion' <<<"$controller_j")"; exit 116; }
              result="$(state_json trackb-ref-continuation-controller-result 2>/dev/null || true)"
              [[ -n "$result" ]] || { echo CONTROLLER_RESULT_STATE_MISSING; exit 117; }
              break
            fi
            sleep 1
          done
          [[ -n "$result" ]] || { echo CONTROLLER_COMPLETION_TIMEOUT; exit 118; }
          jq -e --arg c "$CAMPAIGN_ID" --arg bc "$BASE_CAMPAIGN_ID" --arg br "$BASE_SOURCE_RUN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" --arg p "$main_sha" --arg cr "$controller_run_id" --arg sr "$source_run_id" --arg or "$observer_run_id" \
            '.schemaVersion==1 and .campaignId==$c and .baseCampaignId==$bc and .baseSourceRunId==$br and .proofHead==$h and .attestationSha256==$a and .probeRepoHead==$p and .controllerRunId==$cr and .sourceRunId==$sr and .observerRunId==$or and .forceCancelAccepted==true and .existingFlowCutObserved==true and .sourceRunCancelled==true and .observerRunSucceeded==true and .replacementKvmWorkflowSucceeded==true and .rotationCostUsd==0 and (.rotationMs|type)=="number" and .rotationMs>0 and .canonicalPatch.externalCut.existingFlowCutConfirmed==true and .canonicalPatch.hostReplacement.replacementHealthChecked==true and .canonicalPatch.blastRadius.siblingLostOnHostCut==true' \
            <<<"$result" >/dev/null

          base_observation="$(jq -c '.observation' <<<"$continuation_base")"
          canonical_patch="$(jq -c '.canonicalPatch' <<<"$result")"
          combined_completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          combined="$(jq -nc --argjson b "$base_observation" --argjson p "$canonical_patch" --arg completed "$combined_completed_at" '$b | .completedAt=$completed | .externalCut=$p.externalCut | .hostReplacement=$p.hostReplacement | .blastRadius=$p.blastRadius')"
          jq -e --arg h "$PROOF_HEAD" '.schemaVersion==1 and .candidate=="C2a" and .commitSha==$h and .externalCut.attempted==true and .externalCut.authorityHostExternal==true and .externalCut.existingFlowCutConfirmed==true and .hostReplacement.attempted==true and .hostReplacement.authorityHostExternal==true and .hostReplacement.sourceQuarantined==true and .hostReplacement.sourceRefusedNewSession==true and .hostReplacement.replacementReady==true and .hostReplacement.replacementHealthChecked==true and .blastRadius.attempted==true and .blastRadius.perSessionCutConfirmed==true and .blastRadius.siblingSurvivedSessionCut==true and .blastRadius.hostExternalCutConfirmed==true and .blastRadius.siblingLostOnHostCut==true' <<<"$combined" >/dev/null
          combined_state="$(jq -nc --arg c "$CAMPAIGN_ID" --arg b "$GITHUB_RUN_ID" --arg bc "$BASE_CAMPAIGN_ID" --arg br "$BASE_SOURCE_RUN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" --arg p "$main_sha" --arg o "$observer_run_id" --arg s "$source_run_id" --arg cr "$controller_run_id" --arg rr "$(jq -r '.replacementRunId' <<<"$result")" --argjson observation "$combined" \
            '{schemaVersion:1,campaignId:$c,bootstrapRunId:$b,baseCampaignId:$bc,baseSourceRunId:$br,proofHead:$h,attestationSha256:$a,probeRepoHead:$p,observerRunId:$o,sourceRunId:$s,controllerRunId:$cr,replacementRunId:$rr,observation:$observation}')"
          put_state trackb-ref-combined-observation "$combined_state"
          echo "TRACKB_REFERENCE_CONTINUATION_BOOTSTRAP_PASS"
