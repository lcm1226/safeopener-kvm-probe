name: external-flow-controller

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/external-flow-controller.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove off-host cut of an already-established flow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO"
          campaign="$GITHUB_RUN_ID"
          h=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')

          workflow_runs() {
            curl -fsSL "${h[@]}" "$api/actions/workflows/$1/runs?event=workflow_dispatch&branch=main&per_page=20" | jq -r '.workflow_runs[].id'
          }
          dispatch_gateway() {
            curl -fsSL -o /dev/null -w '%{http_code}' -X POST "${h[@]}" \
              "$api/actions/workflows/external-flow-gateway.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"campaign_id\":\"$campaign\"}}"
          }
          dispatch_worker() {
            local endpoint="$1"
            payload="$(jq -nc --arg c "$campaign" --arg e "$endpoint" '{ref:"main",inputs:{campaign_id:$c,endpoint:$e}}')"
            curl -fsSL -o /dev/null -w '%{http_code}' -X POST "${h[@]}" \
              "$api/actions/workflows/external-flow-worker.yml/dispatches" -d "$payload"
          }
          find_new_run() {
            local wf="$1" before="$2" id
            for _ in $(seq 1 40); do
              while read -r id; do
                [[ -n "$id" ]] || continue
                if ! grep -Fxq "$id" "$before"; then echo "$id"; return 0; fi
              done < <(workflow_runs "$wf")
              sleep 1
            done
            return 1
          }
          run_json() { curl -fsSL "${h[@]}" "$api/actions/runs/$1"; }
          force_cancel() {
            curl -sSL -o /dev/null -w '%{http_code}' -X POST "${h[@]}" "$api/actions/runs/$1/force-cancel"
          }
          state_json() {
            local kind="$1" out code
            out="$(mktemp)"
            code="$(curl -sSL -o "$out" -w '%{http_code}' "${h[@]}" \
              "$api/contents/runtime/${kind}-${campaign}.json?ref=runtime-state")"
            if [[ "$code" == 200 ]]; then
              jq -r '.content' "$out" | tr -d '\n' | base64 -d
              rm -f "$out"
              return 0
            fi
            rm -f "$out"
            return 1
          }
          delete_state() {
            local kind="$1" out code sha body
            out="$(mktemp)"
            code="$(curl -sSL -o "$out" -w '%{http_code}' "${h[@]}" \
              "$api/contents/runtime/${kind}-${campaign}.json?ref=runtime-state")"
            [[ "$code" == 200 ]] || { rm -f "$out"; return 0; }
            sha="$(jq -r '.sha' "$out")"
            rm -f "$out"
            body="$(jq -nc --arg message "runtime cleanup: $kind $campaign" --arg sha "$sha" --arg branch runtime-state \
              '{message:$message,sha:$sha,branch:$branch}')"
            code="$(curl -sSL -o /dev/null -w '%{http_code}' -X DELETE "${h[@]}" \
              "$api/contents/runtime/${kind}-${campaign}.json" -d "$body")"
            [[ "$code" == 200 ]]
          }

          before_gw="$(mktemp)"; workflow_runs external-flow-gateway.yml > "$before_gw"
          code="$(dispatch_gateway)"
          [[ "$code" == 204 ]] || { echo "GATEWAY_DISPATCH_HTTP=$code"; exit 31; }
          gateway_id="$(find_new_run external-flow-gateway.yml "$before_gw")" || { echo GATEWAY_RUN_NOT_FOUND; exit 32; }
          echo "GATEWAY_RUN_ID=$gateway_id"

          gateway_state=''
          for _ in $(seq 1 120); do
            gateway_state="$(state_json gateway 2>/dev/null || true)"
            [[ -n "$gateway_state" ]] && break
            j="$(run_json "$gateway_id")"
            [[ "$(jq -r '.status' <<<"$j")" == completed ]] && { echo GATEWAY_COMPLETED_BEFORE_READY; exit 33; }
            sleep 1
          done
          [[ -n "$gateway_state" ]] || { echo GATEWAY_STATE_TIMEOUT; exit 34; }
          endpoint="$(jq -r '.endpoint' <<<"$gateway_state")"
          [[ "$endpoint" =~ ^https://[a-z0-9-]+\.trycloudflare\.com$ ]] || { echo GATEWAY_ENDPOINT_INVALID; exit 35; }
          [[ "$(jq -r '.gatewayRunId' <<<"$gateway_state")" == "$gateway_id" ]] || { echo GATEWAY_RUN_ID_MISMATCH; exit 36; }
          curl -fsS "$endpoint/status" | jq -e '.active >= 0' >/dev/null
          echo "OFF_HOST_GATEWAY_READY=PASS"

          before_worker="$(mktemp)"; workflow_runs external-flow-worker.yml > "$before_worker"
          code="$(dispatch_worker "$endpoint")"
          [[ "$code" == 204 ]] || { echo "WORKER_DISPATCH_HTTP=$code"; exit 37; }
          worker_id="$(find_new_run external-flow-worker.yml "$before_worker")" || { echo WORKER_RUN_NOT_FOUND; exit 38; }
          echo "WORKER_RUN_ID=$worker_id"

          ready_state=''
          for _ in $(seq 1 90); do
            ready_state="$(state_json ready 2>/dev/null || true)"
            [[ -n "$ready_state" ]] && break
            j="$(run_json "$worker_id")"
            [[ "$(jq -r '.status' <<<"$j")" == completed ]] && { echo WORKER_COMPLETED_BEFORE_READY; exit 39; }
            sleep 1
          done
          [[ -n "$ready_state" ]] || { echo WORKER_READY_TIMEOUT; exit 40; }
          [[ "$(jq -r '.workerRunId' <<<"$ready_state")" == "$worker_id" ]] || { echo WORKER_RUN_ID_MISMATCH; exit 41; }

          active=0
          for _ in $(seq 1 30); do
            active="$(curl -fsS "$endpoint/status" 2>/dev/null | jq -r '.active // 0' 2>/dev/null || echo 0)"
            [[ "$active" =~ ^[1-9][0-9]*$ ]] && break
            sleep 0.5
          done
          [[ "$active" =~ ^[1-9][0-9]*$ ]] || { echo GATEWAY_DID_NOT_OBSERVE_EXISTING_FLOW; exit 42; }
          j="$(run_json "$worker_id")"
          [[ "$(jq -r '.status' <<<"$j")" == in_progress ]] || { echo WORKER_NOT_IN_PROGRESS_AT_REVOKE; exit 43; }
          echo "EXISTING_FLOW_PRE_REVOKE=PASS active=$active"

          revoke_ms="$(date +%s%3N)"
          code="$(force_cancel "$gateway_id")"
          [[ "$code" == 202 || "$code" == 409 ]] || { echo "GATEWAY_FORCE_CANCEL_HTTP=$code"; exit 44; }
          echo "GATEWAY_REVOKE_ISSUED=PASS"

          cut_state=''
          for _ in $(seq 1 150); do
            cut_state="$(state_json cut 2>/dev/null || true)"
            [[ -n "$cut_state" ]] && break
            sleep 1
          done
          [[ -n "$cut_state" ]] || { echo EXISTING_FLOW_CUT_TIMEOUT; exit 45; }
          cut_observed="$(jq -r '.cutObservedAtMs' <<<"$cut_state")"
          pulses="$(jq -r '.pulsesBeforeCut' <<<"$cut_state")"
          [[ "$cut_observed" =~ ^[0-9]+$ && "$pulses" =~ ^[2-9][0-9]*$|^[2-9]$ ]] || { echo CUT_STATE_INVALID; exit 46; }
          cut_ms="$(( cut_observed - revoke_ms ))"
          [[ "$cut_ms" -ge 0 && "$cut_ms" -le 180000 ]] || { echo "CUT_LATENCY_INVALID=$cut_ms"; exit 47; }

          worker_ok=0
          for _ in $(seq 1 60); do
            j="$(run_json "$worker_id")"
            s="$(jq -r '.status' <<<"$j")"; c="$(jq -r '.conclusion // empty' <<<"$j")"
            if [[ "$s" == completed ]]; then
              [[ "$c" == success ]] || { echo "WORKER_CONCLUSION=$c"; exit 48; }
              worker_ok=1; break
            fi
            sleep 1
          done
          [[ "$worker_ok" == 1 ]] || { echo WORKER_COMPLETION_TIMEOUT; exit 49; }

          gateway_cancelled=0
          for _ in $(seq 1 90); do
            j="$(run_json "$gateway_id")"
            s="$(jq -r '.status' <<<"$j")"; c="$(jq -r '.conclusion // empty' <<<"$j")"
            if [[ "$s" == completed ]]; then
              [[ "$c" == cancelled ]] || { echo "GATEWAY_CONCLUSION=$c"; exit 50; }
              gateway_cancelled=1; break
            fi
            sleep 1
          done
          [[ "$gateway_cancelled" == 1 ]] || { echo GATEWAY_CANCEL_COMPLETION_TIMEOUT; exit 51; }

          delete_state gateway
          delete_state ready
          delete_state cut
          echo "RUNTIME_STATE_CLEANUP=PASS"
          echo "EXISTING_FLOW_CUT=PASS"
          echo "EXISTING_FLOW_CUT_MS=$cut_ms"
          echo "PULSES_BEFORE_CUT=$pulses"
          echo "OFF_HOST_NETWORK_CUT_PROBE=PASS"
