name: trackb-reference-continuation-source

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
      base_campaign_id:
        required: true
        type: string
      base_source_run_id:
        required: true
        type: string
      proof_head:
        required: true
        type: string
      attestation_sha256:
        required: true
        type: string
      observer_host:
        required: true
        type: string
      observer_port:
        required: true
        type: string

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate one-time relay key
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          ROOT="$RUNNER_TEMP/trackb-reference-continuation"
          mkdir -p "$ROOT/key" "$ROOT/in" "$ROOT/work"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$ROOT/source-private.pem" >/dev/null 2>&1
          openssl pkey -in "$ROOT/source-private.pem" -pubout -out "$ROOT/key/source-public.pem" >/dev/null 2>&1
          printf '%s\n' "$GITHUB_RUN_ID" > "$ROOT/key/run-id.txt"
          printf '%s\n' '${{ inputs.campaign_id }}' > "$ROOT/key/campaign-id.txt"
          echo "CONTINUATION_SOURCE_RELAY_KEY_READY=PASS"

      - name: Publish one-time public key only
        uses: actions/upload-artifact@v4
        with:
          name: trackb-reference-continuation-key-${{ github.run_id }}
          path: ${{ runner.temp }}/trackb-reference-continuation/key/
          retention-days: 1

      - name: Reuse exact base observation and arm blast-only continuation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          BASE_CAMPAIGN_ID: ${{ inputs.base_campaign_id }}
          BASE_SOURCE_RUN_ID: ${{ inputs.base_source_run_id }}
          PROOF_HEAD_INPUT: ${{ inputs.proof_head }}
          ATTESTATION_SHA256_INPUT: ${{ inputs.attestation_sha256 }}
          OBSERVER_HOST: ${{ inputs.observer_host }}
          OBSERVER_PORT: ${{ inputs.observer_port }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$CAMPAIGN_ID" =~ ^[0-9]+$ ]]
          [[ "$BASE_CAMPAIGN_ID" =~ ^[0-9]+$ ]]
          [[ "$BASE_SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CAMPAIGN_ID" != "$BASE_CAMPAIGN_ID" ]]
          [[ "$PROOF_HEAD_INPUT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ATTESTATION_SHA256_INPUT" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OBSERVER_HOST" == bore.pub ]]
          [[ "$OBSERVER_PORT" =~ ^[0-9]+$ ]] && (( OBSERVER_PORT >= 1024 && OBSERVER_PORT <= 65535 ))

          OBSERVER_IP="$(OBSERVER_HOST="$OBSERVER_HOST" OBSERVER_PORT="$OBSERVER_PORT" python3 - <<'PY'
          import ipaddress, os, socket
          host = os.environ['OBSERVER_HOST']
          port = int(os.environ['OBSERVER_PORT'])
          seen = set()
          for _family, _socktype, _proto, _canonname, sockaddr in socket.getaddrinfo(host, port, family=socket.AF_INET, type=socket.SOCK_STREAM):
              ip = sockaddr[0]
              if ip in seen:
                  continue
              seen.add(ip)
              try:
                  address = ipaddress.ip_address(ip)
              except ValueError:
                  continue
              if address.version != 4 or not address.is_global:
                  continue
              try:
                  with socket.create_connection((ip, port), timeout=10) as connection:
                      connection.sendall(b'preflight\n')
                  print(ip)
                  raise SystemExit(0)
              except OSError:
                  continue
          raise SystemExit(1)
          PY
          )" || { echo OBSERVER_GLOBAL_IPV4_PREFLIGHT_FAILED; exit 69; }
          [[ "$OBSERVER_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "OBSERVER_GLOBAL_IPV4_PREFLIGHT=PASS host=$OBSERVER_HOST ip=$OBSERVER_IP port=$OBSERVER_PORT"

          ROOT="$RUNNER_TEMP/trackb-reference-continuation"
          RELAY_BASE="https://raw.githubusercontent.com/${REPO}/runtime-state/exchange/${GITHUB_RUN_ID}"
          found=0
          for _ in $(seq 1 900); do
            if curl -fsS "$RELAY_BASE/relay.tar.gz.enc.b64" -o "$ROOT/in/relay.tar.gz.enc.b64" \
              && curl -fsS "$RELAY_BASE/relay.pass.enc.b64" -o "$ROOT/in/relay.pass.enc.b64"; then
              found=1; break
            fi
            sleep 1
          done
          [[ "$found" == 1 ]] || { echo RELAY_WAIT_TIMEOUT; exit 70; }
          echo "ENCRYPTED_RELAY_RECEIVED=PASS"

          base64 -d "$ROOT/in/relay.tar.gz.enc.b64" > "$ROOT/in/relay.tar.gz.enc"
          base64 -d "$ROOT/in/relay.pass.enc.b64" > "$ROOT/in/relay.pass.enc"
          openssl pkeyutl -decrypt -inkey "$ROOT/source-private.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$ROOT/in/relay.pass.enc" -out "$ROOT/in/relay.pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:"$ROOT/in/relay.pass" -in "$ROOT/in/relay.tar.gz.enc" -out "$ROOT/in/relay.tar.gz"
          tar -xzf "$ROOT/in/relay.tar.gz" -C "$ROOT/work"
          test -f "$ROOT/work/relay.env"
          test -f "$ROOT/work/trackb-firecracker-campaign.sh"
          test -f "$ROOT/work/trackb-egress-proxy.py"
          test -f "$ROOT/work/trackb-local-attestation.json"
          # shellcheck disable=SC1091
          . "$ROOT/work/relay.env"
          [[ "$PROOF_HEAD" == "$PROOF_HEAD_INPUT" ]]
          [[ "$ATTESTATION_SHA256" == "$ATTESTATION_SHA256_INPUT" ]]
          [[ "$CAMPAIGN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PROXY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(sha256sum "$ROOT/work/trackb-firecracker-campaign.sh" | awk '{print $1}')" == "$CAMPAIGN_SHA256" ]]
          [[ "$(sha256sum "$ROOT/work/trackb-egress-proxy.py" | awk '{print $1}')" == "$PROXY_SHA256" ]]
          [[ "$(sha256sum "$ROOT/work/trackb-local-attestation.json" | awk '{print $1}')" == "$ATTESTATION_SHA256" ]]
          jq -e --arg head "$PROOF_HEAD" '.schemaVersion==1 and .commitSha==$head and .r4DecisionSemanticsPassed==true and .r5IndependentTtlPassed==true and .r5ProvisionCancelPassed==true and .r5CloseConfirmedPassed==true' "$ROOT/work/trackb-local-attestation.json" >/dev/null
          chmod 700 "$ROOT/work/trackb-firecracker-campaign.sh" "$ROOT/work/trackb-egress-proxy.py"
          echo "EXACT_RELAY_BINDING=PASS"

          api="https://api.github.com/repos/$REPO"
          h=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')
          state_json_for_campaign() {
            local kind="$1" campaign="$2" out code
            out="$(mktemp)"
            code="$(curl -sSL -o "$out" -w '%{http_code}' "${h[@]}" "$api/contents/runtime/${kind}-${campaign}.json?ref=runtime-state")"
            if [[ "$code" == 200 ]]; then
              jq -r '.content' "$out" | tr -d '\n' | base64 -d
              rm -f "$out"
              return 0
            fi
            rm -f "$out"
            return 1
          }
          put_state() {
            local kind="$1" payload="$2" encoded body code
            encoded="$(printf '%s' "$payload" | base64 -w0)"
            body="$(jq -nc --arg message "runtime: $kind $CAMPAIGN_ID" --arg content "$encoded" --arg branch runtime-state '{message:$message,content:$content,branch:$branch}')"
            code="$(curl -sS -o "$ROOT/state-put.out" -w '%{http_code}' -X PUT "${h[@]}" "$api/contents/runtime/${kind}-${CAMPAIGN_ID}.json" -d "$body")"
            [[ "$code" == 201 ]] || { cat "$ROOT/state-put.out"; exit 71; }
          }

          base_state="$(state_json_for_campaign trackb-ref-source-base "$BASE_CAMPAIGN_ID")" || { echo BASE_OBSERVATION_MISSING; exit 72; }
          jq -e --arg c "$BASE_CAMPAIGN_ID" --arg r "$BASE_SOURCE_RUN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" \
            '.schemaVersion==1 and .campaignId==$c and .sourceRunId==$r and .proofHead==$h and .attestationSha256==$a and .observation.schemaVersion==1 and .observation.candidate=="C2a" and .observation.commitSha==$h' \
            <<<"$base_state" >/dev/null
          continuation_base="$(jq -nc --arg c "$CAMPAIGN_ID" --arg r "$GITHUB_RUN_ID" --arg bc "$BASE_CAMPAIGN_ID" --arg br "$BASE_SOURCE_RUN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" --argjson observation "$(jq -c '.observation' <<<"$base_state")" \
            '{schemaVersion:1,campaignId:$c,continuationSourceRunId:$r,baseCampaignId:$bc,baseSourceRunId:$br,proofHead:$h,attestationSha256:$a,observation:$observation}')"
          put_state trackb-ref-continuation-base "$continuation_base"
          echo "BASE_OBSERVATION_REUSED=PASS base_campaign=$BASE_CAMPAIGN_ID base_source=$BASE_SOURCE_RUN_ID"

          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          cd "$ROOT/work"
          BLAST_RUN="$ROOT/blast-campaign"
          SO_TRACKB_PROOF_HEAD="$PROOF_HEAD" SO_TRACKB_ALLOW_HOST_APT=1 SO_TRACKB_PACK_MAX=1 SO_TRACKB_RUN_DIR="$BLAST_RUN" \
          SO_TRACKB_BLAST_OBSERVER_IP="$OBSERVER_IP" SO_TRACKB_BLAST_OBSERVER_PORT="$OBSERVER_PORT" SO_TRACKB_BLAST_DURATION_SECONDS=300 \
            bash ./trackb-firecracker-campaign.sh blast-hold >"$ROOT/blast.log" 2>&1 &
          blast_pid=$!
          armed=0
          for _ in $(seq 1 600); do
            if grep -Fq 'BLAST_ARMED' "$ROOT/blast.log"; then armed=1; break; fi
            if ! kill -0 "$blast_pid" 2>/dev/null; then cat "$ROOT/blast.log"; exit 73; fi
            sleep 1
          done
          [[ "$armed" == 1 ]] || { cat "$ROOT/blast.log"; exit 74; }
          armed_ms="$(date +%s%3N)"
          armed_payload="$(jq -nc --arg c "$CAMPAIGN_ID" --arg r "$GITHUB_RUN_ID" --arg bc "$BASE_CAMPAIGN_ID" --arg br "$BASE_SOURCE_RUN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" --arg host "$OBSERVER_HOST" --arg ip "$OBSERVER_IP" --argjson port "$OBSERVER_PORT" --argjson ts "$armed_ms" \
            '{schemaVersion:1,campaignId:$c,continuationSourceRunId:$r,baseCampaignId:$bc,baseSourceRunId:$br,proofHead:$h,attestationSha256:$a,observerHost:$host,observerIp:$ip,observerPort:$port,blastArmedAtMs:$ts,perSessionCutConfirmed:true,siblingSurvivedSessionCut:true,pulseEstablished:true}')"
          put_state trackb-ref-continuation-armed "$armed_payload"
          echo "CONTINUATION_BLAST_ARMED_STATE_PUBLISHED=PASS"

          set +e
          wait "$blast_pid"
          rc=$?
          set -e
          cat "$ROOT/blast.log"
          echo "CONTINUATION_SOURCE_NOT_EXTERNALLY_CANCELLED rc=$rc"
          exit 75
