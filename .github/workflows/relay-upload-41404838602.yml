name: relay-upload-41404838602

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/relay-upload-41404838602.yml

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish exact encrypted relay files fail-closed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: "41404838602"
          PACKAGE_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-2efc-8209-82bd-8a85469f66c9/raw?se=2026-11-02T07%3A23%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=c0e0fa43-a0dd-5126-b4d1-0d966a35b14d&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T00%3A12%3A29Z&ske=2026-11-03T00%3A12%3A29Z&sks=b&skv=2026-02-06&sig=A99WutzH2pWc1K0S5MHk5%2BuCcjkzvU7daoqL1tsQrZs%3D"
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/$REPO"
          h=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')
          tmp="$RUNNER_TEMP/relay-package.zip"
          dir="$RUNNER_TEMP/relay-package"
          mkdir -p "$dir"
          curl -fL --retry 2 --connect-timeout 10 "$PACKAGE_URL" -o "$tmp"
          unzip -q "$tmp" -d "$dir"
          for f in relay.tar.gz.enc.b64 relay.pass.enc.b64 attestation-sha256.txt campaign-sha256.txt proxy-sha256.txt; do test -s "$dir/$f"; done
          for f in relay.tar.gz.enc.b64 relay.pass.enc.b64; do
            path="exchange/$RUN_ID/$f"
            code="$(curl -sS -o "$RUNNER_TEMP/get.out" -w '%{http_code}' "${h[@]}" "$api/contents/$path?ref=runtime-state")"
            [[ "$code" == 404 ]] || { echo "RELAY_COLLISION path=$path code=$code"; exit 70; }
            encoded="$(base64 -w0 "$dir/$f")"
            body="$(jq -nc --arg m "relay: publish encrypted preflight $RUN_ID $f" --arg c "$encoded" --arg b runtime-state '{message:$m,content:$c,branch:$b}')"
            code="$(curl -sS -o "$RUNNER_TEMP/put.out" -w '%{http_code}' -X PUT "${h[@]}" "$api/contents/$path" -d "$body")"
            [[ "$code" == 201 ]] || { cat "$RUNNER_TEMP/put.out"; exit 71; }
          done
          echo "RELAY_CIPHERTEXT_PUBLISH=PASS run=$RUN_ID"
