name: trackb-encrypted-rootfs-diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/trackb-encrypted-rootfs-diagnostic.yml]
permissions:
  contents: read
jobs:
  rootfs-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Generate one-time runner key
        shell: bash
        run: |
          set -Eeuo pipefail; umask 077
          ROOT="$RUNNER_TEMP/so-trackb-rootfs"
          mkdir -p "$ROOT/in" "$ROOT/work" "$ROOT/result" "$ROOT/key-out"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$ROOT/runner-private.pem" >/dev/null 2>&1
          openssl pkey -in "$ROOT/runner-private.pem" -pubout -out "$ROOT/key-out/runner-public.pem" >/dev/null 2>&1
          printf '%s\n' "$GITHUB_RUN_ID" > "$ROOT/key-out/run-id.txt"
          echo RUNNER_KEY_READY
      - name: Publish one-time public key only
        uses: actions/upload-artifact@v4
        with:
          name: trackb-rootfs-runner-key-${{ github.run_id }}
          path: ${{ runner.temp }}/so-trackb-rootfs/key-out/
          retention-days: 1
      - name: Run encrypted exact-candidate rootfs diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail; umask 077
          ROOT="$RUNNER_TEMP/so-trackb-rootfs"
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/exchange/${GITHUB_RUN_ID}"
          found=0
          for _ in $(seq 1 120); do
            ok=1
            for n in 00 01 02 03 04 05; do
              curl -fsS "$BASE/relay.tar.gz.enc.b64.part$n" -o "$ROOT/in/relay.tar.gz.enc.b64.part$n" || { ok=0; break; }
            done
            if [[ "$ok" == 1 ]] && curl -fsS "$BASE/relay.pass.enc.b64" -o "$ROOT/in/relay.pass.enc.b64"; then found=1; break; fi
            sleep 5
          done
          [[ "$found" == 1 ]] || { echo RELAY_WAIT_TIMEOUT; exit 70; }
          echo RELAY_RECEIVED
          cat "$ROOT"/in/relay.tar.gz.enc.b64.part* > "$ROOT/in/relay.tar.gz.enc.b64"
          base64 -d "$ROOT/in/relay.tar.gz.enc.b64" > "$ROOT/in/relay.tar.gz.enc"
          base64 -d "$ROOT/in/relay.pass.enc.b64" > "$ROOT/in/relay.pass.enc"
          openssl pkeyutl -decrypt -inkey "$ROOT/runner-private.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$ROOT/in/relay.pass.enc" -out "$ROOT/in/relay.pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:"$ROOT/in/relay.pass" -in "$ROOT/in/relay.tar.gz.enc" -out "$ROOT/in/relay.tar.gz"
          tar -xzf "$ROOT/in/relay.tar.gz" -C "$ROOT/in"
          . "$ROOT/in/relay.env"
          [[ "$PROOF_HEAD" =~ ^[0-9a-f]{40}$ && "$CAMPAIGN_SHA256" =~ ^[0-9a-f]{64}$ && "$PROXY_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 71
          cp "$ROOT/in/trackb-firecracker-campaign.sh" "$ROOT/work/trackb-firecracker-campaign.sh"
          cp "$ROOT/in/trackb-egress-proxy.py" "$ROOT/work/trackb-egress-proxy.py"
          cd "$ROOT/work"
          [[ "$(sha256sum trackb-firecracker-campaign.sh | awk '{print $1}')" == "$CAMPAIGN_SHA256" ]] || exit 72
          [[ "$(sha256sum trackb-egress-proxy.py | awk '{print $1}')" == "$PROXY_SHA256" ]] || exit 73
          chmod 700 trackb-firecracker-campaign.sh trackb-egress-proxy.py
          echo EXACT_SCRIPTS_VERIFIED
          sudo chmod 666 /dev/kvm; test -r /dev/kvm && test -w /dev/kvm
          RUN_DIR="$ROOT/campaign"
          set +e
          SO_TRACKB_PROOF_HEAD="$PROOF_HEAD" SO_TRACKB_ALLOW_HOST_APT=1 SO_TRACKB_PACK_MAX=1 SO_TRACKB_RUN_DIR="$RUN_DIR" bash ./trackb-firecracker-campaign.sh bootstrap >"$ROOT/result/bootstrap.log" 2>&1
          BOOTSTRAP_RC=$?
          set -e
          printf 'bootstrapRc=%s\n' "$BOOTSTRAP_RC" > "$ROOT/result/summary.txt"
          [[ ! -f "$RUN_DIR/logs/debootstrap.log" ]] || cp "$RUN_DIR/logs/debootstrap.log" "$ROOT/result/debootstrap-outer.log"
          [[ ! -f "$RUN_DIR/work/rootfs-tree/debootstrap/debootstrap.log" ]] || cp "$RUN_DIR/work/rootfs-tree/debootstrap/debootstrap.log" "$ROOT/result/debootstrap-inner.log"
          [[ ! -f "$RUN_DIR/artifacts/rootfs.sha256" ]] || cp "$RUN_DIR/artifacts/rootfs.sha256" "$ROOT/result/rootfs.sha256"
          df -h "$RUNNER_TEMP" | tail -1 | awk '{print "diskFree=" $4}' >> "$ROOT/result/summary.txt"
          cat > "$ROOT/coordinator-public.pem" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA2s+XmeHeVtjxfluErLZW
          hFCawOyReUhn9mdR+Kg7bbn9eTqve6+8zR8Sjcy5DIxAnsc37xBtqJg1e90jWFFJ
          /Ew56xCNAcHr1gtZNdKN2js7+kIeVURteHxYbuGWOjK7qaFUp6BKMpVUDbSfhkhH
          i+giHPu5wtmecSQktw0COq9JCsep//zn1NQW5KW+hCXOzARs9R37RRwrGWdvVGVy
          bJ8VvLRXJfa1jJpJZzldkCJ6hRsrilwV60inJM3puNvyrfG9XHNlhsNN14jxdeqE
          cJ37slmsb38oNUQ/2TKEXN48H87atR9WRl4MJ/ZxqxxLql8mHoKOyIvWpgnvZILA
          WpKmYAgb/fuUYwrg+8jQLbXGF2wIQJP87LaWFHGCuEoivtW1ClfoS5ZDHM/ZCYEw
          3V+kYnmgy+gy0dYfTm3fNbF9bHEctnOjR/ygmh2cdMTThKmgv71Dvz3c6AdHvOeq
          wlzqGh2a8rohMcOqJDR1qcwXiTUoNg8LZRMCUw5nc7HlAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          tar -czf "$ROOT/result.tar.gz" -C "$ROOT/result" .
          openssl rand -hex 32 > "$ROOT/result.pass"
          openssl enc -aes-256-cbc -pbkdf2 -pass file:"$ROOT/result.pass" -in "$ROOT/result.tar.gz" -out "$ROOT/result.tar.gz.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$ROOT/coordinator-public.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$ROOT/result.pass" -out "$ROOT/result.pass.enc"
          echo RESULT_ENCRYPTED
          exit "$BOOTSTRAP_RC"
      - name: Upload encrypted result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trackb-rootfs-diagnostic-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/so-trackb-rootfs/result.tar.gz.enc
            ${{ runner.temp }}/so-trackb-rootfs/result.pass.enc
          if-no-files-found: ignore
          retention-days: 1
