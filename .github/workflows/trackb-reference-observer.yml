name: trackb-reference-observer

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
      proof_head:
        required: true
        type: string
      attestation_sha256:
        required: true
        type: string

permissions:
  contents: write

jobs:
  observer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Start pinned raw-TCP observer and record established-flow cut
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          PROOF_HEAD: ${{ inputs.proof_head }}
          ATTESTATION_SHA256: ${{ inputs.attestation_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ "$CAMPAIGN_ID" =~ ^[0-9]+$ ]]
          [[ "$PROOF_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ATTESTATION_SHA256" =~ ^[0-9a-f]{64}$ ]]

          BORE_VERSION=0.6.0
          BORE_SHA256=e484d1e3acba77169b773f31a5bfb34192d4b660f44a094a658a2522cd2270f7
          BORE_TGZ="$RUNNER_TEMP/bore.tar.gz"
          curl -fL --retry 3 --connect-timeout 10 \
            "https://github.com/ekzhang/bore/releases/download/v${BORE_VERSION}/bore-v${BORE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o "$BORE_TGZ"
          echo "$BORE_SHA256  $BORE_TGZ" | sha256sum -c -
          tar -xzf "$BORE_TGZ" -C "$RUNNER_TEMP"
          chmod 700 "$RUNNER_TEMP/bore"

          cat > "$RUNNER_TEMP/observer.py" <<'PY'
          import json, os, socket, threading, time
          from pathlib import Path
          status = Path(os.environ['STATUS_PATH'])
          lock = threading.Lock()
          state = {'pulseCount':0,'firstPulseAtMs':None,'lastPulseAtMs':None,'cutObservedAtMs':None,'connectionCount':0}
          def now_ms(): return time.time_ns() // 1_000_000
          def save():
              tmp = status.with_suffix('.tmp')
              tmp.write_text(json.dumps(state,separators=(',',':')),encoding='utf-8')
              os.replace(tmp,status)
          def handle(conn):
              had_pulse=False; buf=b''
              with conn:
                  conn.settimeout(15)
                  try:
                      while True:
                          chunk=conn.recv(4096)
                          if not chunk: break
                          buf += chunk
                          while b'\n' in buf:
                              line,buf=buf.split(b'\n',1)
                              if line == b'pulse':
                                  with lock:
                                      ts=now_ms(); state['pulseCount'] += 1; state['lastPulseAtMs']=ts
                                      if state['firstPulseAtMs'] is None: state['firstPulseAtMs']=ts
                                      save()
                                  had_pulse=True
                  except (OSError,socket.timeout): pass
                  finally:
                      if had_pulse:
                          with lock:
                              if state['cutObservedAtMs'] is None: state['cutObservedAtMs']=now_ms(); save()
          with socket.socket(socket.AF_INET,socket.SOCK_STREAM) as server:
              server.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1)
              server.bind(('127.0.0.1',18081)); server.listen(16); save()
              while True:
                  conn,_=server.accept()
                  with lock: state['connectionCount'] += 1; save()
                  threading.Thread(target=handle,args=(conn,),daemon=True).start()
          PY

          STATUS_PATH="$RUNNER_TEMP/observer-status.json" python3 "$RUNNER_TEMP/observer.py" >"$RUNNER_TEMP/observer.log" 2>&1 &
          observer_pid=$!
          trap 'kill "$observer_pid" 2>/dev/null || true; kill "${bore_pid:-}" 2>/dev/null || true' EXIT INT TERM
          for _ in $(seq 1 50); do [[ -s "$RUNNER_TEMP/observer-status.json" ]] && break; sleep 0.1; done
          [[ -s "$RUNNER_TEMP/observer-status.json" ]]

          RUST_LOG=info "$RUNNER_TEMP/bore" local 18081 --to bore.pub >"$RUNNER_TEMP/bore.log" 2>&1 &
          bore_pid=$!
          remote_port=''
          for _ in $(seq 1 120); do
            remote_port="$(grep -Eo 'bore\.pub:[0-9]+' "$RUNNER_TEMP/bore.log" | tail -1 | cut -d: -f2 || true)"
            [[ "$remote_port" =~ ^[0-9]+$ ]] && break
            kill -0 "$bore_pid" 2>/dev/null || { cat "$RUNNER_TEMP/bore.log"; exit 21; }
            sleep 0.5
          done
          [[ "$remote_port" =~ ^[0-9]+$ ]] || { cat "$RUNNER_TEMP/bore.log"; exit 22; }
          OBSERVER_PORT="$remote_port" python3 - <<'PY'
          import os,socket
          with socket.create_connection(('bore.pub',int(os.environ['OBSERVER_PORT'])),timeout=10) as s: s.sendall(b'preflight\n')
          PY
          echo "RAW_TCP_OBSERVER_PREFLIGHT=PASS port=$remote_port"

          put_state() {
            local kind="$1" payload="$2" encoded body code
            encoded="$(printf '%s' "$payload" | base64 -w0)"
            body="$(jq -nc --arg message "runtime: $kind $CAMPAIGN_ID" --arg content "$encoded" --arg branch runtime-state '{message:$message,content:$content,branch:$branch}')"
            code="$(curl -sS -o "$RUNNER_TEMP/state-put.out" -w '%{http_code}' -X PUT -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/contents/runtime/${kind}-${CAMPAIGN_ID}.json" -d "$body")"
            [[ "$code" == 201 ]] || { cat "$RUNNER_TEMP/state-put.out"; exit 23; }
          }

          ready="$(jq -nc --arg c "$CAMPAIGN_ID" --arg r "$GITHUB_RUN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" --arg host bore.pub --argjson port "$remote_port" '{schemaVersion:1,campaignId:$c,observerRunId:$r,proofHead:$h,attestationSha256:$a,host:$host,port:$port,preflightPassed:true}')"
          put_state trackb-ref-observer-ready "$ready"
          echo "OBSERVER_READY=PASS"

          established=''
          for _ in $(seq 1 1800); do
            status="$(cat "$RUNNER_TEMP/observer-status.json")"; pulses="$(jq -r '.pulseCount' <<<"$status")"
            if [[ "$pulses" =~ ^[2-9][0-9]*$|^[2-9]$ ]]; then established="$status"; break; fi
            kill -0 "$bore_pid" 2>/dev/null || exit 24
            sleep 1
          done
          [[ -n "$established" ]] || exit 25
          put_state trackb-ref-observer-established "$(jq -c --arg c "$CAMPAIGN_ID" --arg r "$GITHUB_RUN_ID" --arg h "$PROOF_HEAD" '. + {schemaVersion:1,campaignId:$c,observerRunId:$r,proofHead:$h}' <<<"$established")"
          echo "OBSERVER_ESTABLISHED_FLOW=PASS"

          cut=''
          for _ in $(seq 1 600); do
            status="$(cat "$RUNNER_TEMP/observer-status.json")"; cut_ms="$(jq -r '.cutObservedAtMs // empty' <<<"$status")"
            if [[ "$cut_ms" =~ ^[0-9]+$ ]]; then cut="$status"; break; fi
            sleep 1
          done
          [[ -n "$cut" ]] || exit 26
          put_state trackb-ref-observer-cut "$(jq -c --arg c "$CAMPAIGN_ID" --arg r "$GITHUB_RUN_ID" --arg h "$PROOF_HEAD" '. + {schemaVersion:1,campaignId:$c,observerRunId:$r,proofHead:$h}' <<<"$cut")"
          echo "OBSERVER_EXISTING_FLOW_CUT=PASS"
