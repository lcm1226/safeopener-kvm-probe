name: trackb-reference-continuation-controller

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
      base_campaign_id:
        required: true
        type: string
      base_source_run_id:
        required: true
        type: string
      proof_head:
        required: true
        type: string
      attestation_sha256:
        required: true
        type: string
      probe_repo_head:
        required: true
        type: string
      observer_run_id:
        required: true
        type: string
      source_run_id:
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Measure corrective host cut and replacement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          BASE_CAMPAIGN_ID: ${{ inputs.base_campaign_id }}
          BASE_SOURCE_RUN_ID: ${{ inputs.base_source_run_id }}
          PROOF_HEAD: ${{ inputs.proof_head }}
          ATTESTATION_SHA256: ${{ inputs.attestation_sha256 }}
          PROBE_REPO_HEAD: ${{ inputs.probe_repo_head }}
          OBSERVER_RUN_ID: ${{ inputs.observer_run_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$CAMPAIGN_ID" =~ ^[0-9]+$ ]]
          [[ "$BASE_CAMPAIGN_ID" =~ ^[0-9]+$ ]]
          [[ "$BASE_SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CAMPAIGN_ID" != "$BASE_CAMPAIGN_ID" ]]
          [[ "$PROOF_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ATTESTATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PROBE_REPO_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OBSERVER_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$OBSERVER_RUN_ID" != "$SOURCE_RUN_ID" ]]

          api="https://api.github.com/repos/$REPO"
          h=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')

          run_json() {
            curl -fsSL "${h[@]}" "$api/actions/runs/$1"
          }
          state_json() {
            local kind="$1" out code
            out="$(mktemp)"
            code="$(curl -sSL -o "$out" -w '%{http_code}' "${h[@]}" "$api/contents/runtime/${kind}-${CAMPAIGN_ID}.json?ref=runtime-state")"
            if [[ "$code" == 200 ]]; then
              jq -r '.content' "$out" | tr -d '\n' | base64 -d
              rm -f "$out"
              return 0
            fi
            rm -f "$out"
            return 1
          }
          put_state() {
            local kind="$1" payload="$2" encoded body code
            encoded="$(printf '%s' "$payload" | base64 -w0)"
            body="$(jq -nc --arg message "runtime: $kind $CAMPAIGN_ID" --arg content "$encoded" --arg branch runtime-state '{message:$message,content:$content,branch:$branch}')"
            code="$(curl -sS -o "$RUNNER_TEMP/state-put.out" -w '%{http_code}' -X PUT "${h[@]}" "$api/contents/runtime/${kind}-${CAMPAIGN_ID}.json" -d "$body")"
            [[ "$code" == 201 ]] || { cat "$RUNNER_TEMP/state-put.out"; exit 80; }
          }
          workflow_dispatch_ids() {
            local wf="$1"
            curl -fsSL "${h[@]}" "$api/actions/workflows/$wf/runs?event=workflow_dispatch&branch=main&per_page=30" | jq -r '.workflow_runs[].id'
          }
          find_new_run() {
            local wf="$1" before="$2" id
            for _ in $(seq 1 60); do
              while read -r id; do
                [[ -n "$id" ]] || continue
                if ! grep -Fxq "$id" "$before"; then
                  echo "$id"
                  return 0
                fi
              done < <(workflow_dispatch_ids "$wf")
              sleep 1
            done
            return 1
          }

          main_sha="$(curl -fsSL "${h[@]}" "$api/git/ref/heads/main" | jq -r '.object.sha')"
          [[ "$main_sha" == "$PROBE_REPO_HEAD" ]] || { echo "PROBE_MAIN_MOVED expected=$PROBE_REPO_HEAD actual=$main_sha"; exit 81; }

          source_j="$(run_json "$SOURCE_RUN_ID")"
          observer_j="$(run_json "$OBSERVER_RUN_ID")"
          [[ "$(jq -r '.event' <<<"$source_j")" == workflow_dispatch ]]
          [[ "$(jq -r '.event' <<<"$observer_j")" == workflow_dispatch ]]
          [[ "$(jq -r '.head_sha' <<<"$source_j")" == "$PROBE_REPO_HEAD" ]]
          [[ "$(jq -r '.head_sha' <<<"$observer_j")" == "$PROBE_REPO_HEAD" ]]
          [[ "$(jq -r '.name' <<<"$source_j")" == trackb-reference-continuation-source ]]
          [[ "$(jq -r '.name' <<<"$observer_j")" == trackb-reference-observer ]]
          [[ "$(jq -r '.status' <<<"$source_j")" == in_progress ]]
          [[ "$(jq -r '.status' <<<"$observer_j")" == in_progress ]]

          observer_ready="$(state_json trackb-ref-observer-ready)" || { echo OBSERVER_READY_STATE_MISSING; exit 82; }
          observer_established="$(state_json trackb-ref-observer-established)" || { echo OBSERVER_ESTABLISHED_STATE_MISSING; exit 83; }
          continuation_base="$(state_json trackb-ref-continuation-base)" || { echo CONTINUATION_BASE_STATE_MISSING; exit 84; }
          continuation_armed="$(state_json trackb-ref-continuation-armed)" || { echo CONTINUATION_ARMED_STATE_MISSING; exit 85; }

          jq -e --arg c "$CAMPAIGN_ID" --arg r "$OBSERVER_RUN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" \
            '.schemaVersion==1 and .campaignId==$c and .observerRunId==$r and .proofHead==$h and .attestationSha256==$a and .preflightPassed==true and .host=="bore.pub" and (.port|type)=="number"' \
            <<<"$observer_ready" >/dev/null
          jq -e --arg c "$CAMPAIGN_ID" --arg r "$OBSERVER_RUN_ID" --arg h "$PROOF_HEAD" \
            '.schemaVersion==1 and .campaignId==$c and .observerRunId==$r and .proofHead==$h and (.pulseCount|type)=="number" and .pulseCount>=2 and .cutObservedAtMs==null' \
            <<<"$observer_established" >/dev/null
          jq -e --arg c "$CAMPAIGN_ID" --arg r "$SOURCE_RUN_ID" --arg bc "$BASE_CAMPAIGN_ID" --arg br "$BASE_SOURCE_RUN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" \
            '.schemaVersion==1 and .campaignId==$c and .continuationSourceRunId==$r and .baseCampaignId==$bc and .baseSourceRunId==$br and .proofHead==$h and .attestationSha256==$a and .observation.schemaVersion==1 and .observation.candidate=="C2a" and .observation.commitSha==$h' \
            <<<"$continuation_base" >/dev/null
          jq -e --arg c "$CAMPAIGN_ID" --arg r "$SOURCE_RUN_ID" --arg bc "$BASE_CAMPAIGN_ID" --arg br "$BASE_SOURCE_RUN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" \
            '.schemaVersion==1 and .campaignId==$c and .continuationSourceRunId==$r and .baseCampaignId==$bc and .baseSourceRunId==$br and .proofHead==$h and .attestationSha256==$a and .observerHost=="bore.pub" and (.observerIp|type)=="string" and .pulseEstablished==true and .perSessionCutConfirmed==true and .siblingSurvivedSessionCut==true' \
            <<<"$continuation_armed" >/dev/null
          [[ "$(jq -r '.port' <<<"$observer_ready")" == "$(jq -r '.observerPort' <<<"$continuation_armed")" ]]
          if state_json trackb-ref-observer-cut >/dev/null 2>&1; then
            echo "PREEXISTING_OBSERVER_CUT_STATE"
            exit 99
          fi
          echo "PRE_REVOKE_CONTINUATION_BINDING=PASS"

          revoke_requested_ms="$(date +%s%3N)"
          code="$(curl -sS -o "$RUNNER_TEMP/force-cancel.out" -w '%{http_code}' -X POST "${h[@]}" "$api/actions/runs/${SOURCE_RUN_ID}/force-cancel")"
          [[ "$code" == 202 ]] || { cat "$RUNNER_TEMP/force-cancel.out"; echo "SOURCE_FORCE_CANCEL_HTTP=$code"; exit 86; }
          revoke_accepted_ms="$(date +%s%3N)"
          echo "SOURCE_FORCE_CANCEL_ACCEPTED=PASS"

          cut_state=''
          for _ in $(seq 1 240); do
            cut_state="$(state_json trackb-ref-observer-cut 2>/dev/null || true)"
            [[ -n "$cut_state" ]] && break
            sleep 1
          done
          [[ -n "$cut_state" ]] || { echo OBSERVER_CUT_STATE_TIMEOUT; exit 87; }
          jq -e --arg c "$CAMPAIGN_ID" --arg r "$OBSERVER_RUN_ID" --arg h "$PROOF_HEAD" \
            '.schemaVersion==1 and .campaignId==$c and .observerRunId==$r and .proofHead==$h and (.pulseCount|type)=="number" and .pulseCount>=2 and (.cutObservedAtMs|type)=="number"' \
            <<<"$cut_state" >/dev/null
          cut_observed_ms="$(jq -r '.cutObservedAtMs' <<<"$cut_state")"
          revoke_to_cut_ms="$(( cut_observed_ms - revoke_requested_ms ))"
          (( revoke_to_cut_ms >= 0 && revoke_to_cut_ms <= 180000 )) || { echo "REVOKE_TO_CUT_INVALID=$revoke_to_cut_ms"; exit 88; }
          echo "EXISTING_FLOW_CUT_MEASURED=PASS ms=$revoke_to_cut_ms"

          source_terminal=0
          source_terminal_observed_ms=0
          for _ in $(seq 1 180); do
            source_j="$(run_json "$SOURCE_RUN_ID")"
            if [[ "$(jq -r '.status' <<<"$source_j")" == completed ]]; then
              [[ "$(jq -r '.conclusion' <<<"$source_j")" == cancelled ]] || { echo "SOURCE_CONCLUSION=$(jq -r '.conclusion' <<<"$source_j")"; exit 89; }
              source_terminal=1
              source_terminal_observed_ms="$(date +%s%3N)"
              break
            fi
            sleep 1
          done
          [[ "$source_terminal" == 1 ]] || { echo SOURCE_CANCEL_TIMEOUT; exit 90; }
          echo "SOURCE_TERMINAL_CANCELLED=PASS"

          observer_success=0
          for _ in $(seq 1 120); do
            observer_j="$(run_json "$OBSERVER_RUN_ID")"
            if [[ "$(jq -r '.status' <<<"$observer_j")" == completed ]]; then
              [[ "$(jq -r '.conclusion' <<<"$observer_j")" == success ]] || { echo "OBSERVER_CONCLUSION=$(jq -r '.conclusion' <<<"$observer_j")"; exit 91; }
              observer_success=1
              break
            fi
            sleep 1
          done
          [[ "$observer_success" == 1 ]] || { echo OBSERVER_COMPLETION_TIMEOUT; exit 92; }

          before_replacement="$(mktemp)"
          workflow_dispatch_ids kvm-probe.yml > "$before_replacement"
          dispatch_body='{"ref":"main"}'
          code="$(curl -sS -o "$RUNNER_TEMP/replacement-dispatch.out" -w '%{http_code}' -X POST "${h[@]}"             "$api/actions/workflows/kvm-probe.yml/dispatches" -d "$dispatch_body")"
          [[ "$code" == 204 ]] || { cat "$RUNNER_TEMP/replacement-dispatch.out"; echo "REPLACEMENT_DISPATCH_HTTP=$code"; exit 93; }
          replacement_run_id="$(find_new_run kvm-probe.yml "$before_replacement")" || { echo REPLACEMENT_RUN_NOT_FOUND; exit 94; }
          replacement_j="$(run_json "$replacement_run_id")"
          [[ "$(jq -r '.event' <<<"$replacement_j")" == workflow_dispatch ]]
          [[ "$(jq -r '.name' <<<"$replacement_j")" == kvm-capability-probe ]]
          [[ "$(jq -r '.head_sha' <<<"$replacement_j")" == "$PROBE_REPO_HEAD" ]]
          echo "REPLACEMENT_RUN_ID=$replacement_run_id"

          replacement_success=0
          replacement_ready_ms=0
          for _ in $(seq 1 180); do
            replacement_j="$(run_json "$replacement_run_id")"
            [[ "$(jq -r '.head_sha' <<<"$replacement_j")" == "$PROBE_REPO_HEAD" ]] || { echo REPLACEMENT_HEAD_MISMATCH; exit 95; }
            if [[ "$(jq -r '.status' <<<"$replacement_j")" == completed ]]; then
              [[ "$(jq -r '.conclusion' <<<"$replacement_j")" == success ]] || { echo "REPLACEMENT_CONCLUSION=$(jq -r '.conclusion' <<<"$replacement_j")"; exit 96; }
              replacement_success=1
              replacement_ready_ms="$(date +%s%3N)"
              break
            fi
            sleep 1
          done
          [[ "$replacement_success" == 1 ]] || { echo REPLACEMENT_TIMEOUT; exit 97; }
          rotation_ms="$(( replacement_ready_ms - revoke_requested_ms ))"
          (( rotation_ms > 0 )) || { echo "ROTATION_MS_INVALID=$rotation_ms"; exit 98; }
          echo "REPLACEMENT_KVM_HEALTH=PASS rotation_ms=$rotation_ms"

          canonical_patch="$(jq -nc \
            --argjson revokeToCut "$revoke_to_cut_ms" --argjson rotation "$rotation_ms" \
            '{externalCut:{attempted:true,authorityHostExternal:true,revokeIssued:true,cutConfirmed:true,existingFlowCutConfirmed:true,revokeToCutMs:$revokeToCut},hostReplacement:{attempted:true,authorityHostExternal:true,sourceQuarantined:true,sourceRefusedNewSession:true,replacementReady:true,replacementHealthChecked:true,rotationMs:$rotation,rotationCostUsd:0,rotationCostSourceId:"github-public-standard-runner-zero-charge"},blastRadius:{attempted:true,perSessionCutConfirmed:true,siblingSurvivedSessionCut:true,hostExternalCutConfirmed:true,siblingLostOnHostCut:true}}')"
          result="$(jq -nc \
            --arg c "$CAMPAIGN_ID" --arg bc "$BASE_CAMPAIGN_ID" --arg br "$BASE_SOURCE_RUN_ID" --arg h "$PROOF_HEAD" --arg a "$ATTESTATION_SHA256" --arg p "$PROBE_REPO_HEAD" \
            --arg cr "$GITHUB_RUN_ID" --arg sr "$SOURCE_RUN_ID" --arg or "$OBSERVER_RUN_ID" --arg rr "$replacement_run_id" \
            --arg authority github-actions-control-plane --arg quarantineBasis github-force-cancel-terminal --arg refusalBasis terminal-host-cannot-serve --arg siblingLossBasis terminal-host-plus-observer-cut --arg cleanupBasis github-hosted-ephemeral-runner-terminal \
            --argjson revokeRequested "$revoke_requested_ms" --argjson revokeAccepted "$revoke_accepted_ms" --argjson cutObserved "$cut_observed_ms" --argjson revokeToCut "$revoke_to_cut_ms" \
            --argjson sourceTerminal "$source_terminal_observed_ms" --argjson replacementReady "$replacement_ready_ms" --argjson rotation "$rotation_ms" --argjson canonicalPatch "$canonical_patch" \
            '{schemaVersion:1,campaignId:$c,baseCampaignId:$bc,baseSourceRunId:$br,proofHead:$h,attestationSha256:$a,probeRepoHead:$p,controllerRunId:$cr,sourceRunId:$sr,observerRunId:$or,replacementRunId:$rr,providerAuthority:$authority,sourceQuarantineBasis:$quarantineBasis,sourceRefusalBasis:$refusalBasis,siblingLossBasis:$siblingLossBasis,continuationCleanupZero:true,continuationCleanupBasis:$cleanupBasis,revokeRequestedAtMs:$revokeRequested,revokeAcceptedAtMs:$revokeAccepted,cutObservedAtMs:$cutObserved,revokeToCutMs:$revokeToCut,forceCancelAccepted:true,existingFlowCutObserved:true,sourceRunCancelled:true,sourceTerminalObservedAtMs:$sourceTerminal,observerRunSucceeded:true,replacementKvmWorkflowSucceeded:true,replacementReadyObservedAtMs:$replacementReady,rotationMs:$rotation,rotationCostUsd:0,rotationCostSourceId:"github-public-standard-runner-zero-charge",canonicalPatch:$canonicalPatch}')"
          put_state trackb-ref-continuation-controller-result "$result"
          echo "TRACKB_REFERENCE_CONTINUATION_CONTROLLER_EVIDENCE=PASS"
